<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal AI Learning Cockpit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Auth Overlay -->
  <div id="auth-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:var(--bg-app); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h2 style="margin-bottom:16px;">Restricted Workspace</h2>
    <div style="display:flex; gap:8px;">
      <input type="password" id="auth-password" placeholder="Enter password" style="padding:8px 12px; border-radius:4px; border:1px solid var(--border-light); background:var(--bg-card); color:white; font-size:14px; width:200px;" onkeydown="if(event.key==='Enter') checkAuth()" />
      <button class="primary" onclick="checkAuth()">Unlock</button>
    </div>
    <div id="auth-error" style="color:var(--bg-fj-red); margin-top:12px; font-size:14px; display:none;">Incorrect password.</div>
  </div>
  
  <div id="sidebar">
    <div class="sidebar-header">AI Learning Cockpit</div>
    
    <div class="nav-group-label">Learning</div>
    <div class="nav-item" onclick="navigate('dashboard')" id="nav-dashboard">Dashboard</div>
    <div class="nav-item" onclick="navigate('roadmap')" id="nav-roadmap">Roadmap & Modules</div>
    <div class="nav-item" onclick="navigate('graph')" id="nav-graph">Knowledge Graph</div>
    
    <div class="nav-group-label">Intelligence</div>
    <div class="nav-item" onclick="navigate('hub')" id="nav-hub">Intelligence Hub</div>
    <div class="nav-item" onclick="navigate('projects')" id="nav-projects">Project Studio</div>
    
    <div class="nav-group-label">Workspace</div>
    <div class="nav-item" onclick="navigate('notes')" id="nav-notes">Personal Notes</div>
  </div>

  <div id="main">
    <div id="topbar">
      <button id="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
      <!-- Breadcrumbs / Top Status -->
      <span id="topbar-content">Dashboard</span>
    </div>
    
    <div id="content">
      <!-- Rendered dynamically via app.js -->
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
